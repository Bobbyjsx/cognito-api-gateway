version: 2.1

jobs:
  test:
    docker:
      - image: cimg/go:1.25
    steps:
      - checkout
      - run:
          name: Run Linter and Format Check
          command: make lint
      - run:
          name: Run Unit and Integration Tests
          command: make test

  deploy-production:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run:
          name: Set Environment Variables
          command: |
            echo "export DEPLOY_VERSION=${CIRCLE_SHA1}" >> "$BASH_ENV"
            echo "export SERVICE_NAME=cognito-gateway-production" >> "$BASH_ENV"
            echo "export GCP_PROJECT_ID=${GCP_PROJECT_ID:-project-atlas-501612}" >> "$BASH_ENV"
            echo "export ENV_DECLARATION_FILE=../.env.example" >> "$BASH_ENV"
            echo "export BUILD_CONTEXT=.." >> "$BASH_ENV"
            echo "export DOCKERFILE=../Dockerfile" >> "$BASH_ENV"
            echo "export PORT=8000" >> "$BASH_ENV"
            echo "export DOCKER_NETWORK=docker_webnet" >> "$BASH_ENV"
      - run:
          name: Clone deploy-ops
          command: git clone --branch main https://github.com/Bobbyjsx/deploy-ops.git
      - run:
          name: Build and Deploy
          command: |
            cd deploy-ops
            make build
            make deploy

  deploy-staging:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      - run:
          name: Set Environment Variables
          command: |
            echo "export DEPLOY_VERSION=${CIRCLE_SHA1}" >> "$BASH_ENV"
            echo "export SERVICE_NAME=cognito-gateway-staging" >> "$BASH_ENV"
            echo "export GCP_PROJECT_ID=${GCP_PROJECT_ID:-project-atlas-501612}" >> "$BASH_ENV"
            echo "export ENV_DECLARATION_FILE=../.env.example" >> "$BASH_ENV"
            echo "export BUILD_CONTEXT=.." >> "$BASH_ENV"
            echo "export DOCKERFILE=../Dockerfile" >> "$BASH_ENV"
            echo "export PORT=8000" >> "$BASH_ENV"
            echo "export DOCKER_NETWORK=docker_webnet" >> "$BASH_ENV"
      - run:
          name: Clone deploy-ops
          command: git clone --branch main https://github.com/Bobbyjsx/deploy-ops.git
      - run:
          name: Build and Deploy
          command: |
            cd deploy-ops
            make build
            make deploy

workflows:
  version: 2
  build-and-deploy-production:
    jobs:
      - test:
          context:
            - cognito-gateway-prod
          filters:
            branches:
              only:
                - main
                - master
      - deploy-production:
          requires:
            - test
          context:
            - cognito-gateway-prod
            - deploy-ops
          filters:
            branches:
              only:
                - main
                - master

  build-and-deploy-staging:
    jobs:
      - deploy-staging:
          context:
            - cognito-gateway-staging
            - deploy-ops-staging
          filters:
            branches:
              only:
                - staging
